name: Validate

# Skill and plugin validation. Supply-chain hardened: SHA-pinned actions,
# npm ci --ignore-scripts from package-lock.json, harden-runner egress audit.
# Keep aligned with neondatabase/neon-for-agent-platforms — see AGENTS.md.

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate.yml'
      - '.github/dependabot.yml'
  push:
    branches:
      - main
    paths:
      - 'skills/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate.yml'
      - '.github/dependabot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    # ubuntu-latest, not neondatabase-protected-runner-group: npm ci fetches
    # from the public registry, which the protected group cannot reach.
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run validation
        run: npm run validate:ci
